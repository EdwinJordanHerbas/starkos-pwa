# OKIRO · Nginx del host
# Ruta en el servidor: /etc/nginx/sites-available/okirosport
# Lo despliega deploy.sh; no hace falta copiarlo a mano.
#
# ESTE ARCHIVO ES EL DEL SERVIDOR, NO UNA PROPUESTA. Durante meses el del repo
# fue otro: mandaba "/" al backend de Node y le faltaban nueve rutas de API.
# Copiarlo habría hecho dos destrozos a la vez — dejar media app en 404 y
# publicar el directorio del backend entero, .secrets incluido. Si cambias el
# enrutado en el servidor, vuelca el archivo aquí:
#   ssh droplet 'cat /etc/nginx/sites-available/okirosport' > nginx.conf

server {
    listen 80;
    server_name okirosport.es www.okirosport.es;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name okirosport.es www.okirosport.es;

    ssl_certificate     /etc/letsencrypt/live/okirosport.es/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/okirosport.es/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    # Sin includeSubDomains a propósito: de okirosport.es cuelgan otros sitios
    # y esto los obligaría a todos a HTTPS sin avisar.
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;

    # Gzip
    gzip on;
    gzip_types text/html application/javascript application/json text/css;

    # ── Backend API (Node en :3000) ────────────────────────────
    # Los 19 prefijos que sirve server.js. Al añadir una ruta nueva hay que
    # tocar esta lista: si no, nginx la contesta con su propio 404 y desde la
    # app parece que el backend está roto. Ya pasó con /resumen y /medidas.
    location ~ ^/(auth|cruce|ejercicios|health|ia|logs|medidas|mision|notion|nutricion|party|progreso|proyectos|push|resumen|rutinas|sesiones|strava|tareas)(/.*)?$ {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # ── PWA estática (contenedor `pwa`, nginx:alpine en :8080) ──
    # Va al contenedor de la PWA y NO al backend a propósito: el backend sirve
    # su propio directorio como estáticos, así que enchufar "/" a :3000
    # publicaría server.js, las migraciones y .secrets. Node ya lo bloquea por
    # su lado, pero esta separación es la primera barrera y la más barata.
    location / {
        proxy_pass         http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
    }
}
