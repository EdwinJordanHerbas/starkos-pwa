# OkiroSport · Nginx config
# Ruta en el servidor: /etc/nginx/sites-available/okirosport
# Activar: ln -s /etc/nginx/sites-available/okirosport /etc/nginx/sites-enabled/
# Recargar:  nginx -t && systemctl reload nginx

# Rutas que van al backend (Node.js :3000)
map $uri $is_api {
    default               0;
    ~^/health             1;
    ~^/logs               1;
    ~^/proyectos          1;
    ~^/rutinas            1;
    ~^/ejercicios         1;
    ~^/sesiones           1;
    ~^/nutricion          1;
    ~^/strava             1;
    ~^/notion             1;
}

server {
    listen 80;
    server_name okirosport.es www.okirosport.es;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name okirosport.es www.okirosport.es;

    ssl_certificate     /etc/letsencrypt/live/okirosport.es/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/okirosport.es/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    # Gzip
    gzip on;
    gzip_types text/html application/javascript application/json text/css;

    # ── Backend API ────────────────────────────────────────────
    location ~ ^/(health|logs|proyectos|rutinas|ejercicios|sesiones|nutricion|strava|notion)(/.*)?$ {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # ── PWA estática ───────────────────────────────────────────
    location / {
        proxy_pass         http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
    }
}
